<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReleaseLog - Basic Example</title>
  <link rel="stylesheet" href="../dist/releaselog.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #24292e;
      margin-bottom: 20px;
    }
    .description {
      color: #586069;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>ReleaseLog - Basic Example</h1>
  <p class="description">
    A simple example loading releases from a JSON file with default configuration.
  </p>

  <div id="releases"></div>

  <script src="../dist/releaselog.umd.js"></script>
  <script>
    // Basic usage - just point to a JSON file
    const table = new ReleaseLog.ReleaseLog("#releases", {
      ajaxURL: "sample-data.json",
      pagination: {
        enabled: true,
        size: 10
      },
      events: {
        releaseClick: function(event, release) {
          // Open the release page when clicked
          if (release.html_url) {
            window.open(release.html_url, '_blank');
          }
        },
        dataLoaded: function(data) {
          console.log('Loaded', data.releases.length, 'releases');
        }
      }
    });
  </script>
</body>
</html>
